<!doctype html>
<!--
  iPhone 17 device frame for previewing Kakinotes in the browser pane.
  Dev tooling only. The dev server serves it at /dev/iphone-17
  (app/dev/iphone-17/route.ts, 404 in production), e.g.
    http://localhost:3102/dev/iphone-17?src=/stories&theme=dark
  Same origin as the app, so the framed page is scriptable from the parent.

  The screen is the real 402×874pt iPhone 17 viewport. The site runs as the
  installed (standalone) home-screen app would: no Safari chrome, a 62pt
  status bar over the Dynamic Island, and a 34pt home-indicator strip. A desktop
  browser reports env(safe-area-inset-*) as 0, so the frame reserves those
  insets itself — the iframe is 402×778 between them. Real inset behaviour
  still needs the iOS Simulator or a phone.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iPhone 17 Preview</title>
    <style>
      :root {
        --page: #e9ebef;
        --page-ink: #1d1d1f;
        --toolbar: #ffffff;
        --toolbar-border: #d2d2d7;
        --body-metal: #2a2c30;
        --body-metal-hi: #4a4d53;
        --bezel: #050505;
        /* Status bar colours follow the app's theme, not the page's. */
        --screen-bg: #020617;
        --status-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #111214;
          --page-ink: #f5f5f7;
          --toolbar: #1c1c1e;
          --toolbar-border: #38383a;
        }
      }
      :root[data-theme="dark"] {
        --page: #111214;
        --page-ink: #f5f5f7;
        --toolbar: #1c1c1e;
        --toolbar-border: #38383a;
      }
      :root[data-app-theme="light"] {
        --screen-bg: #eef2f7;
        --status-ink: #000000;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--page);
        color: var(--page-ink);
        font:
          13px/1.3 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      /* ---------- toolbar (outside the phone) ---------- */
      .toolbar {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 10px 16px 0;
        padding: 6px;
        width: min(560px, calc(100% - 32px));
        background: var(--toolbar);
        border: 1px solid var(--toolbar-border);
        border-radius: 999px;
      }
      .toolbar input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 6px 10px;
        outline: none;
      }
      .toolbar button {
        border: 1px solid var(--toolbar-border);
        background: transparent;
        color: inherit;
        font: inherit;
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .toolbar button:focus-visible,
      .toolbar input:focus-visible {
        outline: 2px solid #0a84ff;
        outline-offset: 1px;
      }

      /* ---------- stage that scales the phone to fit ---------- */
      .stage {
        flex: 1;
        width: 100%;
        display: grid;
        place-items: center;
        min-height: 0;
      }
      .scaler {
        /* Real-size phone box; JS sets --scale so it fits the pane. */
        width: calc(var(--phone-w) * var(--scale, 1));
        height: calc(var(--phone-h) * var(--scale, 1));
        --phone-w: 446px;
        --phone-h: 918px;
      }

      /* ---------- the phone ---------- */
      .phone {
        position: relative;
        width: var(--phone-w);
        height: var(--phone-h);
        transform: scale(var(--scale, 1));
        transform-origin: top left;
      }
      /* Aluminium band. */
      .band {
        position: absolute;
        inset: 0;
        border-radius: 72px;
        background: linear-gradient(
          145deg,
          var(--body-metal-hi),
          var(--body-metal) 30%,
          var(--body-metal) 70%,
          var(--body-metal-hi)
        );
        box-shadow:
          0 30px 60px -20px rgba(0, 0, 0, 0.45),
          0 12px 24px -12px rgba(0, 0, 0, 0.35),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* Black glass bezel. */
      .glass {
        position: absolute;
        inset: 5px;
        border-radius: 67px;
        background: var(--bezel);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      /* Display: 402×874pt. */
      .screen {
        position: absolute;
        left: 22px;
        top: 22px;
        width: 402px;
        height: 874px;
        border-radius: 55px;
        overflow: hidden;
        background: var(--screen-bg);
        isolation: isolate;
      }
      .screen iframe {
        position: absolute;
        left: 0;
        top: 62px;
        width: 402px;
        height: 778px;
        border: 0;
        background: var(--screen-bg);
      }
      /* Simulated insets: the app fills the whole screen under the status
         bar and home indicator, as an installed app with viewportFit cover
         does, and its env(safe-area-inset-*) rules get iPhone 17 values. */
      :root[data-insets="sim"] .screen iframe {
        top: 0;
        height: 874px;
      }

      /* Side buttons. Left: Action, volume up, volume down.
         Right: side (power) button, Camera Control. */
      .btn {
        position: absolute;
        width: 4px;
        background: linear-gradient(
          90deg,
          var(--body-metal-hi),
          var(--body-metal)
        );
        border-radius: 2px;
      }
      .btn.left {
        left: -3px;
      }
      .btn.right {
        right: -3px;
        background: linear-gradient(
          270deg,
          var(--body-metal-hi),
          var(--body-metal)
        );
      }
      .action {
        top: 168px;
        height: 34px;
      }
      .vol-up {
        top: 236px;
        height: 62px;
      }
      .vol-down {
        top: 312px;
        height: 62px;
      }
      .power {
        top: 262px;
        height: 100px;
      }
      .camera-control {
        top: 560px;
        height: 58px;
        width: 3px;
        right: -1px !important;
        background: linear-gradient(270deg, #6b6f76, #2b2d31) !important;
      }

      /* Status bar (62pt tall, matches the Dynamic Island safe-area inset). */
      .status {
        position: absolute;
        inset: 0 0 auto 0;
        height: 62px;
        z-index: 2;
        color: var(--status-ink);
        pointer-events: none;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      }
      .time {
        position: absolute;
        left: 0;
        width: 138px;
        top: 19px;
        text-align: center;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.2px;
        font-variant-numeric: tabular-nums;
      }
      .indicators {
        position: absolute;
        right: 0;
        width: 138px;
        top: 23px;
        display: flex;
        gap: 6px;
        justify-content: center;
        align-items: center;
      }
      .indicators svg {
        display: block;
        fill: currentColor;
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 125px;
        height: 37px;
        margin-left: -62.5px;
        background: #000;
        border-radius: 20px;
        z-index: 3;
      }
      .island::after {
        /* Front camera lens glint. */
        content: "";
        position: absolute;
        right: 14px;
        top: 50%;
        width: 12px;
        height: 12px;
        margin-top: -6px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #2a3550, #0b0d14 60%);
      }

      /* Home indicator strip (34pt bottom inset). */
      .home {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34px;
        z-index: 2;
        pointer-events: none;
      }
      .home::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 140px;
        height: 5px;
        margin-left: -70px;
        border-radius: 3px;
        background: var(--status-ink);
      }
    </style>
  </head>
  <body>
    <form class="toolbar" id="bar" autocomplete="off">
      <input id="addr" aria-label="Address" spellcheck="false" value="/" />
      <button type="submit">Go</button>
      <button type="button" id="reload" aria-label="Reload page">↻</button>
      <button type="button" id="theme" aria-pressed="true">Dark app</button>
      <button type="button" id="insets" aria-pressed="true">
        Insets: simulated
      </button>
    </form>

    <div class="stage" id="stage">
      <div class="scaler" id="scaler">
        <div class="phone" role="img" aria-label="iPhone 17 frame">
          <div class="band"></div>
          <span class="btn left action"></span>
          <span class="btn left vol-up"></span>
          <span class="btn left vol-down"></span>
          <span class="btn right power"></span>
          <span class="btn right camera-control"></span>
          <div class="glass"></div>
          <div class="screen">
            <div class="status" aria-hidden="true">
              <div class="time" id="clock">9:41</div>
              <div class="indicators">
                <!-- Cellular -->
                <svg width="18" height="12" viewBox="0 0 18 12">
                  <rect x="0" y="8" width="3" height="4" rx="1" />
                  <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
                  <rect x="10" y="3" width="3" height="9" rx="1" />
                  <rect x="15" y="0" width="3" height="12" rx="1" />
                </svg>
                <!-- Wi-Fi -->
                <svg width="16" height="12" viewBox="0 0 16 12">
                  <path
                    d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.3C13.3 1.6 10.8.5 8 .5S2.7 1.6.8 3.4L2 4.7c1.6-1.5 3.7-2.4 6-2.4Z"
                  />
                  <path
                    d="M8 5.8c1.4 0 2.6.5 3.6 1.4l1.2-1.3C11.5 4.7 9.8 4 8 4s-3.5.7-4.8 1.9l1.2 1.3c1-.9 2.2-1.4 3.6-1.4Z"
                  />
                  <path
                    d="M8 9.3c.5 0 1 .2 1.4.5L8 11.5 6.6 9.8c.4-.3.9-.5 1.4-.5Z"
                  />
                </svg>
                <!-- Battery -->
                <svg width="27" height="13" viewBox="0 0 27 13">
                  <rect
                    x="0.5"
                    y="0.5"
                    width="23"
                    height="12"
                    rx="3.8"
                    fill="none"
                    stroke="currentColor"
                    opacity="0.4"
                  />
                  <rect x="2" y="2" width="16" height="9" rx="2.4" />
                  <path
                    d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z"
                    opacity="0.45"
                  />
                </svg>
              </div>
            </div>
            <div class="island"></div>
            <iframe
              id="app"
              title="Kakinotes on iPhone 17"
              src="about:blank"
            ></iframe>
            <div class="home" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const frame = document.getElementById("app");
      const addr = document.getElementById("addr");
      const themeBtn = document.getElementById("theme");
      const root = document.documentElement;

      const start = params.get("src") || addr.value;
      addr.value = start;
      frame.src = start;
      // Keep the address field in step with in-app navigation.
      frame.addEventListener("load", () => {
        try {
          const l = frame.contentWindow.location;
          addr.value = l.pathname + l.search + l.hash;
        } catch {}
        installInsetShim();
      });

      // ---- Safe-area inset simulation ----------------------------------
      // Desktop browsers resolve env(safe-area-inset-*) to 0 and env() can't
      // be redefined, so in "simulated" mode every same-origin CSS rule that
      // uses it is cloned into one unlayered override sheet with the iPhone
      // 17 portrait values substituted. Unlayered beats Tailwind's @layer
      // utilities, and the clone keeps its @media/@supports wrappers.
      const INSETS = { top: 62, bottom: 34, left: 0, right: 0 };
      const ENV_RE =
        /env\(\s*safe-area-inset-(top|bottom|left|right)\s*(?:,[^)]*)?\)/g;
      const SHIM_ID = "__safe-area-shim";
      const insetsBtn = document.getElementById("insets");

      function shimText(doc) {
        const out = [];
        const walk = (rules, wrappers) => {
          for (const rule of rules) {
            const text = rule.cssText;
            if (!text.includes("safe-area-inset")) continue;
            // The rules belong to the iframe's realm, so `instanceof` against
            // this window's CSSStyleRule is always false: match by name.
            const kind = rule.constructor.name;
            if (kind === "CSSStyleRule") {
              let css = text.replace(ENV_RE, (_, side) => INSETS[side] + "px");
              for (const w of [...wrappers].reverse())
                css = w + "{" + css + "}";
              out.push(css);
            } else if (kind === "CSSMediaRule") {
              walk(rule.cssRules, [
                ...wrappers,
                "@media " + rule.conditionText,
              ]);
            } else if (kind === "CSSSupportsRule") {
              walk(rule.cssRules, [
                ...wrappers,
                "@supports " + rule.conditionText,
              ]);
            } else if (rule.cssRules) {
              // @layer blocks and the like: unwrap, so the clone is unlayered.
              walk(rule.cssRules, wrappers);
            }
          }
        };
        for (const sheet of doc.styleSheets) {
          if (sheet.ownerNode && sheet.ownerNode.id === SHIM_ID) continue;
          try {
            walk(sheet.cssRules, []);
          } catch {
            // Cross-origin sheet (web fonts): nothing of ours in it.
          }
        }
        return out.join("\n");
      }

      function refreshShim() {
        let doc;
        try {
          doc = frame.contentDocument;
        } catch {
          return;
        }
        if (!doc || !doc.head) return;
        let el = doc.getElementById(SHIM_ID);
        if (root.dataset.insets !== "sim") {
          el?.remove();
          return;
        }
        if (!el) {
          el = doc.createElement("style");
          el.id = SHIM_ID;
        }
        el.textContent = shimText(doc);
        doc.head.appendChild(el); // (re)append so it stays last
      }

      let observer;
      function installInsetShim() {
        observer?.disconnect();
        let doc;
        try {
          doc = frame.contentDocument;
        } catch {
          return;
        }
        if (!doc) return;
        refreshShim();
        // Client-side navigations stream in new CSS chunks: re-shim on any
        // stylesheet that is added or finishes loading.
        let queued = false;
        const queue = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            refreshShim();
          });
        };
        observer = new MutationObserver((records) => {
          for (const r of records)
            for (const n of r.addedNodes)
              if (n.id !== SHIM_ID && /^(STYLE|LINK)$/.test(n.nodeName)) {
                n.addEventListener?.("load", queue);
                queue();
              }
        });
        observer.observe(doc.head, { childList: true });
      }

      function setInsets(mode) {
        root.dataset.insets = mode;
        insetsBtn.textContent =
          mode === "sim" ? "Insets: simulated" : "Insets: reserved";
        insetsBtn.setAttribute("aria-pressed", String(mode === "sim"));
        refreshShim();
      }
      setInsets(params.get("insets") === "reserved" ? "reserved" : "sim");
      insetsBtn.addEventListener("click", () =>
        setInsets(root.dataset.insets === "sim" ? "reserved" : "sim"),
      );

      function setAppTheme(t) {
        root.dataset.appTheme = t;
        themeBtn.textContent = t === "light" ? "Light app" : "Dark app";
        themeBtn.setAttribute("aria-pressed", String(t === "dark"));
      }
      setAppTheme(params.get("theme") === "light" ? "light" : "dark");
      themeBtn.addEventListener("click", () =>
        setAppTheme(root.dataset.appTheme === "light" ? "dark" : "light"),
      );

      document.getElementById("bar").addEventListener("submit", (e) => {
        e.preventDefault();
        frame.src = addr.value.trim() || "/";
      });
      document.getElementById("reload").addEventListener("click", () => {
        frame.src = frame.src;
      });

      // iOS status-bar clock: h:mm, no AM/PM.
      function tick() {
        const d = new Date();
        document.getElementById("clock").textContent =
          ((d.getHours() + 11) % 12) +
          1 +
          ":" +
          String(d.getMinutes()).padStart(2, "0");
      }
      tick();
      setInterval(tick, 15000);

      // Scale the real-size phone down to fit the pane, never up.
      const scaler = document.getElementById("scaler");
      const stage = document.getElementById("stage");
      function fit() {
        const r = stage.getBoundingClientRect();
        const s = Math.min(1, (r.height - 24) / 918, (r.width - 32) / 446);
        scaler.style.setProperty("--scale", String(Math.max(0.3, s)));
      }
      new ResizeObserver(fit).observe(stage);
      fit();
    </script>
  </body>
</html>
