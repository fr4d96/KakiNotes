<!doctype html>
<!--
  The offline screen. public/sw.js keeps this one file on
  the phone and shows it in place of a page that cannot load: no internet,
  or the host Mac / Cloudflare Tunnel is down (Cloudflare's 502/530 pages).
  It is fully self-contained -- inline CSS, script and icon, no fonts, no other
  requests -- because nothing else is reachable when it is on screen.
  It holds no story content, by design (Engineering Rules 12-14).
  See "Offline screen" in docs/architecture.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2f0ec" />
    <title>Kakinotes is offline</title>
    <script>
      // Same theme rule as lib/theme-init-script.ts: saved choice, else system.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("journiq-theme");
          theme =
            saved === "dark" || saved === "light"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        --background: #f2f0ec;
        --foreground: #24201c;
        --muted: #675f57;
        --card: #fbfaf8;
        --accent: #0068a3;
        --accent-foreground: #ffffff;
        --badge: #fbfaf8;
        --shadow: rgba(36, 32, 28, 0.13);
        color-scheme: light;
      }
      [data-theme="dark"] {
        --background: #1c1a18;
        --foreground: #ece7e0;
        --muted: #aaa297;
        --card: #262320;
        --accent: #3fb6f2;
        --accent-foreground: #1c1a18;
        --badge: #302d29;
        --shadow: rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .art {
        position: relative;
        width: 168px;
        height: 168px;
        margin: 0 auto 28px;
      }
      .tile {
        width: 132px;
        height: 132px;
        margin: 18px auto 0;
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 12px 32px var(--shadow);
        overflow: hidden;
        animation: float 4s ease-in-out infinite;
      }
      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0.88;
        filter: saturate(0.75);
      }
      .badge {
        position: absolute;
        right: 6px;
        bottom: 2px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--badge);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px var(--shadow);
      }
      .zzz {
        position: absolute;
        top: 0;
        right: 0;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .zzz span {
        position: absolute;
        opacity: 0;
        animation: drift 3.6s ease-in-out infinite;
      }
      .zzz span:nth-child(1) {
        right: 18px;
        top: 22px;
        font-size: 0.75rem;
      }
      .zzz span:nth-child(2) {
        right: 6px;
        top: 6px;
        font-size: 0.875rem;
        animation-delay: 1.2s;
      }
      .zzz span:nth-child(3) {
        right: -10px;
        top: -12px;
        font-size: 1.125rem;
        animation-delay: 2.4s;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
        margin: 0 0 10px;
        font-weight: 700;
      }
      p {
        font-size: 1rem;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 28px;
      }
      button {
        appearance: none;
        border: 0;
        width: 100%;
        min-height: 52px;
        border-radius: 9999px;
        background: var(--accent);
        color: var(--accent-foreground);
        font: inherit;
        font-size: 1.125rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.12s ease,
          opacity 0.12s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      button[aria-busy="true"] {
        opacity: 0.75;
      }
      button[aria-busy="true"] svg {
        animation: spin 0.8s linear infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-6px) rotate(2deg);
        }
      }
      @keyframes drift {
        0% {
          opacity: 0;
          transform: translate(0, 6px);
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(6px, -10px);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tile,
        .zzz span,
        button[aria-busy="true"] svg {
          animation: none;
        }
        .zzz span {
          opacity: 1;
        }
      }
    </style>
  </head>

      <h1 id="title">Kakinotes is offline</h1>
      <p id="body">
        We can't reach Kakinotes right now. Check your internet connection, or
        try again in a little while.
      </p>
      <button id="retry" type="button">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
        <span id="retry-label">Refresh</span>
      </button>

    <script>
      (function () {
        // Language: the same NEXT_LOCALE cookie the app sets (i18n/locales.ts).
        var copy = {
          zh: {
            lang: "zh-CN",
            title: "Kakinotes 暂时连不上",
            body: "现在无法连接到 Kakinotes。请检查网络连接，或稍后再试。",
            retry: "刷新",
          },
        };
        var match = /(?:^|;\s*)NEXT_LOCALE=([^;]*)/.exec(document.cookie);
        var t = match && match[1].indexOf("zh") === 0 ? copy.zh : null;
        if (t) {
          document.documentElement.lang = t.lang;
          document.title = t.title;
          document.getElementById("title").textContent = t.title;
          document.getElementById("body").textContent = t.body;
          document.getElementById("retry-label").textContent = t.retry;
        }

        // The address bar still holds the page the reader asked for (the
        // service worker answered that request with this file), so a plain
        // reload asks for the real page again.
        var button = document.getElementById("retry");
        function retry() {
          button.setAttribute("aria-busy", "true");
          button.disabled = true;
          setTimeout(function () {
            location.reload();
          }, 250);
        }
        button.addEventListener("click", retry);
        // Coming back online (e.g. Wi-Fi reconnects) retries by itself.
        window.addEventListener("online", retry);
      })();
    </script>
